name: Build Timezone Database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Скачивание кода репозитория
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Обновление ссылки на свежие границы мира
        run: |
          LATEST_URL=$(curl -s https://github.com | grep "browser_download_url.*timezones\.shapefile\.zip\"" | cut -d '"' -f 4)
          echo "Актуальная ссылка: $LATEST_URL"
          if [ -n "$LATEST_URL" ]; then
            sed -i "s|https://github.com[^\"]*|$LATEST_URL|g" pom.xml
          fi

      - name: Скачивание границ и компиляция (Maven)
        run: mvn clean compile

      - name: Подготовка файлов и запуск генератора
        run: |
          mkdir -p target/classes/timezones.shapefile
          mkdir -p target/classes/output
          cp -r src/main/resources/* target/classes/
          
          # Находим скачанный .shp файл (даже если он во вложенной папке dist) и переносим в корень timezones.shapefile
          SHP_PATH=$(find src/main/resources target/classes -name "*.shp" | head -n 1)
          echo "Найден исходный shapefile: $SHP_PATH"
          SHP_DIR=$(dirname "$SHP_PATH")
          SHP_BASE=$(basename "$SHP_PATH" .shp)
          
          # Копируем все связанные файлы (.shp, .shx, .dbf, .prj, .cpg) под точным именем combined-shapefile
          for ext in shp shx dbf prj cpg; do
            if [ -f "$SHP_DIR/$SHP_BASE.$ext" ]; then
              cp "$SHP_DIR/$SHP_BASE.$ext" "target/classes/timezones.shapefile/combined-shapefile.$ext"
            fi
          done
          
          ls -la target/classes/timezones.shapefile/
          mvn exec:java -Dexec.mainClass="net.haraldkreuzer.DatabaseCreator" -DMAVEN_OPTS="-Xmx6G"

      - name: Проверка результата и расчет хеш-суммы
        run: |
          DB_FILE="target/classes/output/timezones.bin"
          ls -lh "$DB_FILE"
          cp "$DB_FILE" ./timezones.bin
          sha256sum timezones.bin > timezones.bin.sha256

      - name: Публикация в раздел Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-db
          name: "Актуальная база часовых поясов (Автосборка)"
          files: |
            timezones.bin
            timezones.bin.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
