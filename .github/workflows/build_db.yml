name: Build Timezone Database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Скачивание кода репозитория
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Обновление ссылки на свежие границы мира
        run: |
          LATEST_URL=$(curl -s https://github.com | grep "browser_download_url.*timezones\.shapefile\.zip\"" | cut -d '"' -f 4)
          echo "Актуальная ссылка: $LATEST_URL"
          if [ -n "$LATEST_URL" ]; then
            sed -i "s|https://github.com[^\"]*|$LATEST_URL|g" pom.xml
          fi

      - name: Скачивание границ и компиляция (Maven)
        run: mvn clean compile

      - name: Подготовка папок ресурсов и запуск генератора
        run: |
          mkdir -p target/classes/output
          cp -r src/main/resources/* target/classes/
          mvn exec:java -Dexec.mainClass="net.haraldkreuzer.DatabaseCreator" -Dexec.args="" -DMAVEN_OPTS="-Xmx4G"

      - name: Поиск готового файла и расчет хеш-суммы
        run: |
          DB_FILE=$(find target -type f -name "*.bin" -o -name "*database*" | grep -v "\.class" | head -n 1)
          echo "Найден файл базы: $DB_FILE"
          ls -lh "$DB_FILE"
          cp "$DB_FILE" ./timezones.bin
          sha256sum timezones.bin > timezones.bin.sha256

      - name: Публикация в раздел Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-db
          name: "Актуальная база часовых поясов (Автосборка)"
          files: |
            timezones.bin
            timezones.bin.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
