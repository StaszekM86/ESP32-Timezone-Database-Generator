name: Build Timezone Database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Скачивание кода репозитория
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Обновление системной базы IANA и генерация чистого timezones.conf
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tzdata
          CONF_FILE="src/main/resources/timezones/timezones.conf"
          > "$CONF_FILE"
          
          cd /usr/share/zoneinfo
          find -L Africa America Antarctica Arctic Asia Atlantic Australia Etc Europe Indian Pacific -type f | sort | while read -r zone_name; do
            posix_str=$(tail -n 1 "$zone_name" | tr -d '\r\n')
            if [ -n "$posix_str" ] && [ ${#posix_str} -lt 60 ]; then
              echo "${zone_name}=${posix_str}" >> "$GITHUB_WORKSPACE/$CONF_FILE"
            fi
          done
          cd "$GITHUB_WORKSPACE"
          
          echo "Сгенерировано актуальных зон IANA: $(wc -l < "$CONF_FILE")"
          grep -E "^(Europe/Istanbul|Europe/Moscow|Asia/Vladivostok|Europe/Bratislava)=" "$CONF_FILE"

      - name: Компиляция Java-кода
        run: mvn clean test-compile -Ddownload.skip=true

      - name: Прямое скачивание и распаковка актуальных границ мира
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p target/classes/timezones.shapefile
          mkdir -p target/classes/output
          cp -r src/main/resources/* target/classes/
          
          gh release download --repo evansiroky/timezone-boundary-builder --pattern "*timezones.shapefile.zip" --output shapes.zip
          unzip -q shapes.zip -d extracted_shapes
          
          SHP_PATH=$(find extracted_shapes -name "*.shp" | head -n 1)
          SHP_DIR=$(dirname "$SHP_PATH")
          SHP_BASE=$(basename "$SHP_PATH" .shp)
          
          for ext in shp shx dbf prj cpg; do
            if [ -f "$SHP_DIR/$SHP_BASE.$ext" ]; then
              cp "$SHP_DIR/$SHP_BASE.$ext" "target/classes/timezones.shapefile/combined-shapefile.$ext"
            fi
          done

      - name: Запуск генератора базы данных
        run: |
          mvn exec:java -Dexec.mainClass="net.haraldkreuzer.DatabaseCreator" -Ddownload.skip=true -DMAVEN_OPTS="-Xmx6G"

      - name: Проверка реальных изменений (без учета даты в заголовке) и публикация
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DB_FILE="target/classes/output/timezones.bin"
          CONF_FILE="src/main/resources/timezones/timezones.conf"
          cp "$DB_FILE" ./timezones.bin
          
          # Скачиваем предыдущую версию из Releases для побайтового сравнения
          if gh release download latest-db --pattern "timezones.bin" --output old_timezones.bin 2>/dev/null; then
            echo "Сравниваем содержимое новой и старой баз (игнорируя 32 байта заголовка с датой)..."
            if cmp -s -i 32 timezones.bin old_timezones.bin; then
              echo ">>> Изменений в границах и правилах IANA нет. Публикация не требуется!"
              exit 0
            else
              echo ">>> Обнаружены реальные изменения в часовых поясах! Обновляем релиз..."
            fi
          else
            echo "Предыдущий релиз не найден, выполняем первую публикацию..."
          fi
          
          # Считаем контрольную сумму и публикуем все 3 файла в обновленный релиз
          sha256sum timezones.bin > timezones.bin.sha256
          gh release delete latest-db --yes 2>/dev/null || true
          gh release create latest-db timezones.bin timezones.bin.sha256 "$CONF_FILE" \
            --title "Актуальная база часовых поясов (Обновлено: $(date +%Y-%m-%d))" \
            --notes "Автоматическая сборка. Включает актуальные правила IANA и границы."
