name: Build Timezone Database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Скачивание кода репозитория
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Автоматическая генерация свежего timezones.conf из официального репозитория IANA
        run: |
          mkdir -p iana_compiled
          echo "Клонируем официальный репозиторий координатора IANA (eggert/tz)..."
          git clone --depth 1 https://github.com iana_src
          
          # Компилируем правила IANA системным компилятором zic
          zic -d iana_compiled iana_src/africa iana_src/antarctica iana_src/asia iana_src/australasia iana_src/europe iana_src/northamerica iana_src/southamerica iana_src/etcetera iana_src/backward
          
          # Извлекаем актуальные POSIX-строки и формируем новый timezones.conf
          CONF_FILE="src/main/resources/timezones/timezones.conf"
          > "$CONF_FILE"
          
          cd iana_compiled
          find . -type f | sort | while read -r filepath; do
            zone_name="${filepath#./}"
            posix_str=$(tail -n 1 "$filepath")
            if [ -n "$posix_str" ]; then
              echo "${zone_name}=${posix_str}" >> "../$CONF_FILE"
            fi
          done
          cd ..
          
          echo "Сгенерировано актуальных зон IANA: $(wc -l < "$CONF_FILE")"
          echo "Проверка ключевых зон в новом конфиге:"
          grep -E "^(Europe/Istanbul|Europe/Moscow|Asia/Vladivostok|America/New_York)=" "$CONF_FILE"

      - name: Компиляция Java-кода
        run: mvn clean test-compile -Ddownload.skip=true

      - name: Прямое скачивание и распаковка актуальных границ мира
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p target/classes/timezones.shapefile
          mkdir -p target/classes/output
          cp -r src/main/resources/* target/classes/
          
          gh release download --repo evansiroky/timezone-boundary-builder --pattern "*timezones.shapefile.zip" --output shapes.zip
          unzip -q shapes.zip -d extracted_shapes
          
          SHP_PATH=$(find extracted_shapes -name "*.shp" | head -n 1)
          SHP_DIR=$(dirname "$SHP_PATH")
          SHP_BASE=$(basename "$SHP_PATH" .shp)
          
          for ext in shp shx dbf prj cpg; do
            if [ -f "$SHP_DIR/$SHP_BASE.$ext" ]; then
              cp "$SHP_DIR/$SHP_BASE.$ext" "target/classes/timezones.shapefile/combined-shapefile.$ext"
            fi
          done

      - name: Запуск генератора базы данных
        run: |
          mvn exec:java -Dexec.mainClass="net.haraldkreuzer.DatabaseCreator" -Ddownload.skip=true -DMAVEN_OPTS="-Xmx6G"

      - name: Проверка результата и расчет хеш-суммы
        run: |
          DB_FILE="target/classes/output/timezones.bin"
          ls -lh "$DB_FILE"
          cp "$DB_FILE" ./timezones.bin
          sha256sum timezones.bin > timezones.bin.sha256

      - name: Публикация в раздел Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-db
          name: "Актуальная база часовых поясов (Автосборка IANA)"
          files: |
            timezones.bin
            timezones.bin.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
